server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Unlighthouse reports (lighthouse.html, screenshots, etc.), served by the backend's
    # own StaticFiles mount at /app/reports. Without this, these requests fell through to the
    # SPA catch-all below and silently served index.html instead (200 OK, wrong content — the
    # dashboard reloaded instead of showing the actual report).
    location /reports/ {
        proxy_pass http://backend:8000/reports/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
