services:
  postgres:
    image: postgres:16-alpine
    container_name: wp_auditor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-wp_audits}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditor} -d ${POSTGRES_DB:-wp_audits}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wp_auditor_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auditor}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-wp_audits}
    networks:
      - internal
      - db
    volumes:
      - ./backend/app:/app/app
      - ./backend/reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wp_auditor_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - web
      - internal
    labels:
      traefik.enable: "true"
      traefik.http.routers.wpaudit.rule: "Host(`${APP_HOST}`)"
      traefik.http.routers.wpaudit.entrypoints: "websecure"
      traefik.http.routers.wpaudit.tls.certresolver: "letsencrypt"
      traefik.http.services.wpaudit.loadbalancer.server.port: "80"

networks:
  web:
    external: true
  internal:
    # backend <-> frontend only; normal egress (backend needs internet to audit external sites)
  db:
    internal: true # backend <-> postgres only; no internet, matches server convention for DBs

volumes:
  postgres_data:
    driver: local
